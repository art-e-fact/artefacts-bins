name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-install:
    name: Linux Installation · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nothing (before)
        run: |
          ! command -v artefacts >/dev/null
          test ! -e "${PREFIX:-/usr/local}/share/artefacts"
      - name: Install
        run: ./scripts/install.sh
      - name: Expose bin on PATH
        run: echo "${PREFIX:-/usr/local}/bin" >> "$GITHUB_PATH"
      - name: Check command
        run: artefacts --version
      - name: Uninstall
        if: always()
        run: ./scripts/uninstall.sh --all
      - name: Nothing (after)
        if: always()
        run: |
          ! command -v artefacts >/dev/null
          test ! -e "${PREFIX:-/usr/local}/share/artefacts"

  darwin-install:
    name: Darwin Installation · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nothing (before)
        run: |
          ! command -v artefacts >/dev/null
          test ! -e "${PREFIX:-/usr/local}/share/artefacts"
      - name: Install
        run: ./scripts/install.sh
      - name: Expose bin on PATH
        run: echo "${PREFIX:-/usr/local}/bin" >> "$GITHUB_PATH"
      - name: Check command
        run: artefacts --version
      - name: Uninstall
        if: always()
        run: ./scripts/uninstall.sh --all
      - name: Nothing (after)
        if: always()
        run: |
          ! command -v artefacts >/dev/null
          test ! -e "${PREFIX:-/usr/local}/share/artefacts"

